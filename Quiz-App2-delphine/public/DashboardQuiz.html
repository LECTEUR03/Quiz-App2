<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Quiz</title>
    <link rel="stylesheet" href="./css/dashbordUser.css" />
    <style>
        .badge {
            display: inline-block;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
        }
        /* Modal */
        #modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        #modal-box {
            background: white;
            border-radius: 12px;
            padding: 32px;
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        #modal-box h3 { margin-bottom: 16px; }
        #modal-box p  { margin-bottom: 8px; font-size: 14px; }
        .q-item {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .q-item strong { display: block; margin-bottom: 6px; }
        .q-item span.correct { color: #22c55e; font-weight: 700; }
    </style>
</head>
<body>
    <header>
        <nav>
            <img src="./img/logo.png" alt="logo" />
            <div>
                <h3>DASHBOARD ADMIN</h3>
                <h2>Gérer les quiz et les utilisateurs</h2>
            </div>
        </nav>
    </header>
    <main>
        <div class="container_dashboard">
            <div class="menu_dash">
                <div>
                    <a href="Dashboard.html">Vue d'ensemble</a>
                </div>
                <div>
                    <a href="DashboardUser.html">Utilisateurs</a>
                </div>
                <div class="ensemble">
                    <a href="DashboardQuiz.html" id="ensemble">Quiz</a>
                </div>
                <div id="fin">
                    <a href="sd.html">← Site</a>
                </div>
            </div>
        </div>

        <div class="search">
            <div class="conatinerSearch">
                <div>
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="search" placeholder="Rechercher un quiz...">
                </div>
                <div>
                    <span id="total-quizzes" style="font-weight:bold;color:#302F5C;">0 quiz</span>
                </div>
            </div>
        </div>

        <div class="VisuelTable">
            <div class="containTable">
                <table>
                    <thead>
                        <tr>
                            <th>Titre</th>
                            <th>Catégorie</th>
                            <th>Questions</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quizzes-tbody">
                        <tr><td colspan="4" style="text-align:center;color:#9ca3af;">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL DÉTAIL QUIZ -->
    <div id="modal-overlay" style="display:none;">
        <div id="modal-box">
            <h3 id="modal-title">Détail du quiz</h3>
            <p id="modal-categorie"></p>
            <div id="modal-questions"></div>
            <button onclick="fermerModal()" style="margin-top:16px;width:auto;padding:10px 24px;">Fermer</button>
        </div>
    </div>

<script src="https://kit.fontawesome.com/90223747f9.js" crossorigin="anonymous"></script>
<script>
let tousLesQuizzes = [];

async function chargerQuizzes() {
    try {
        const res     = await fetch('/quiz');
        const quizzes = await res.json();

        if (!Array.isArray(quizzes)) {
            document.getElementById('quizzes-tbody').innerHTML =
                '<tr><td colspan="4" style="text-align:center;color:#9ca3af;">Aucun quiz trouvé</td></tr>';
            return;
        }

        tousLesQuizzes = quizzes;
        document.getElementById('total-quizzes').textContent = `${quizzes.length} quiz`;
        afficherQuizzes(quizzes);

    } catch (err) {
        console.error('Erreur :', err);
        document.getElementById('quizzes-tbody').innerHTML =
            '<tr><td colspan="4" style="text-align:center;color:red;">Erreur de chargement</td></tr>';
    }
}

function afficherQuizzes(quizzes) {
    const tbody = document.getElementById('quizzes-tbody');
    tbody.innerHTML = '';

    if (quizzes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#9ca3af;">Aucun résultat</td></tr>';
        return;
    }

    quizzes.forEach(quiz => {
        const catNom = quiz.categorie?.nom || 'N/A';
        const nbQ    = quiz.questions?.length || 0;
        const tr     = document.createElement('tr');
        tr.innerHTML = `
            <td>${quiz.title || 'Sans titre'}</td>
            <td><span class="badge">${catNom}</span></td>
            <td>${nbQ} question(s)</td>
            <td>
                <button class="btn edit"   onclick="voirQuiz('${quiz._id}')">Voir</button>
                <button class="btn delete" onclick="supprimerQuiz('${quiz._id}')">Supprimer</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Recherche
document.getElementById('search').addEventListener('input', function () {
    const q       = this.value.toLowerCase();
    const filtres = tousLesQuizzes.filter(qz =>
        (qz.title || '').toLowerCase().includes(q) ||
        (qz.categorie?.nom || '').toLowerCase().includes(q)
    );
    afficherQuizzes(filtres);
});

// Voir détail
function voirQuiz(id) {
    const quiz = tousLesQuizzes.find(q => q._id === id);
    if (!quiz) return;

    document.getElementById('modal-title').textContent     = quiz.title || 'Sans titre';
    document.getElementById('modal-categorie').innerHTML   =
        `<span class="badge">${quiz.categorie?.nom || 'N/A'}</span> — ${quiz.questions?.length || 0} questions`;

    const container = document.getElementById('modal-questions');
    container.innerHTML = '';

    (quiz.questions || []).forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'q-item';
        div.innerHTML = `
            <strong>Q${i + 1}. ${q.question}</strong>
            ${q.options.map(opt =>
                `<div>${opt === q.correct ? `<span class="correct">✅ ${opt}</span>` : opt}</div>`
            ).join('')}
        `;
        container.appendChild(div);
    });

    document.getElementById('modal-overlay').style.display = 'flex';
}

function fermerModal() {
    document.getElementById('modal-overlay').style.display = 'none';
}

// Supprimer
async function supprimerQuiz(id) {
    if (!confirm('Supprimer ce quiz et toutes ses questions ?')) return;
    try {
        await fetch(`/quiz/${id}`, { method: 'DELETE' });
        chargerQuizzes();
    } catch (err) {
        alert('Erreur lors de la suppression');
    }
}

chargerQuizzes();
</script>
</body>
</html>
