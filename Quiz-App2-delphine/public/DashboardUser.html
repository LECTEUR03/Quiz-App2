<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Utilisateurs</title>
    <link rel="stylesheet" href="./css/dashbordUser.css" />
</head>
<body>
    <header>
        <nav>
            <img src="./img/logo.png" alt="logo" />
            <div>
                <h3>DASHBOARD ADMIN</h3>
                <h2>Gérer les quiz et les utilisateurs</h2>
            </div>
        </nav>
    </header>
    <main>
        <div class="container_dashboard">
            <div class="menu_dash">
                <div>
                    <a href="Dashboard.html">Vue d'ensemble</a>
                </div>
                <div class="ensemble">
                    <a href="DashboardUser.html" id="ensemble">Utilisateurs</a>
                </div>
                <div>
                    <a href="DashboardQuiz.html">Quiz</a>
                </div>
                <div id="fin">
                    <a href="sd.html">← Site</a>
                </div>
            </div>
        </div>

        <div class="search">
            <div class="conatinerSearch">
                <div>
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="search" placeholder="Rechercher par nom...">
                </div>
                <div>
                    <span id="total-users" style="font-weight:bold;color:#302F5C;">0 utilisateur(s)</span>
                </div>
            </div>
        </div>

        <div class="VisuelTable">
            <div class="containTable">
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="3" style="text-align:center;color:#9ca3af;">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL MODIFICATION -->
    <div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;">
        <div style="background:white;border-radius:12px;padding:32px;width:400px;max-width:90%;">
            <h3 style="margin-bottom:20px;">Modifier l'utilisateur</h3>
            <input id="modal-nom"   type="text"  placeholder="Nom"   style="width:100%;padding:10px;margin-bottom:12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;"/>
            <input id="modal-email" type="email" placeholder="Email" style="width:100%;padding:10px;margin-bottom:20px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;"/>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button onclick="fermerModal()" style="background:#e5e7eb;color:#111;width:auto;padding:10px 20px;">Annuler</button>
                <button onclick="sauvegarderUser()"  style="width:auto;padding:10px 20px;">Sauvegarder</button>
            </div>
        </div>
    </div>

<script src="https://kit.fontawesome.com/90223747f9.js" crossorigin="anonymous"></script>
<script>
let tousLesUsers = [];
let userEnCours  = null;

async function chargerUsers() {
    try {
        const res   = await fetch('/user/users');
        const users = await res.json();

        if (!Array.isArray(users)) {
            document.getElementById('users-tbody').innerHTML =
                '<tr><td colspan="3" style="text-align:center;color:#9ca3af;">Aucun utilisateur trouvé</td></tr>';
            return;
        }

        tousLesUsers = users;
        document.getElementById('total-users').textContent = `${users.length} utilisateur(s)`;
        afficherUsers(users);

    } catch (err) {
        console.error('Erreur :', err);
        document.getElementById('users-tbody').innerHTML =
            '<tr><td colspan="3" style="text-align:center;color:red;">Erreur de chargement</td></tr>';
    }
}

function afficherUsers(users) {
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '';

    if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#9ca3af;">Aucun résultat</td></tr>';
        return;
    }

    users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${user.nom}</td>
            <td>${user.email}</td>
            <td>
                <button class="btn edit"   onclick="ouvrirModal('${user._id}', '${user.nom.replace(/'/g,"\\'")}', '${user.email}')">Modifier</button>
                <button class="btn delete" onclick="supprimerUser('${user._id}')">Supprimer</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Recherche en temps réel
document.getElementById('search').addEventListener('input', function () {
    const q       = this.value.toLowerCase();
    const filtres = tousLesUsers.filter(u => u.nom.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
    afficherUsers(filtres);
});

// Supprimer
async function supprimerUser(id) {
    if (!confirm('Supprimer cet utilisateur ?')) return;
    try {
        await fetch(`/user/delete/user/${id}`, { method: 'DELETE' });
        chargerUsers();
    } catch (err) {
        alert('Erreur lors de la suppression');
    }
}

// Modal modification
function ouvrirModal(id, nom, email) {
    userEnCours = id;
    document.getElementById('modal-nom').value   = nom;
    document.getElementById('modal-email').value = email;
    document.getElementById('modal').style.display = 'flex';
}

function fermerModal() {
    document.getElementById('modal').style.display = 'none';
    userEnCours = null;
}

async function sauvegarderUser() {
    const nom   = document.getElementById('modal-nom').value.trim();
    const email = document.getElementById('modal-email').value.trim();
    if (!nom || !email) return alert('Remplis tous les champs');

    try {
        await fetch(`/user/update/user/${userEnCours}`, {
            method:  'PUT',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ nom, email })
        });
        fermerModal();
        chargerUsers();
    } catch (err) {
        alert('Erreur lors de la modification');
    }
}

chargerUsers();
</script>
</body>
</html>
